<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carousel — demo, not linked from the site</title>
<meta name="robots" content="noindex">
<script>document.documentElement.className+=' js'</script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="bg-land">

<style>
/* A ring of photographs you drag round. The React component this replaces did the
   same thing with a state update inside requestAnimationFrame — sixty React
   re-renders a second. Here one number is written to one custom property and CSS
   moves every card, so the main thread does almost nothing. */
.ring-wrap {
  position: relative;
  height: min(78vh, 620px);
  margin: clamp(1.5rem, 5vw, 3rem) 0 clamp(2rem, 6vw, 4rem);
  perspective: 1400px;
  overflow: hidden;
  touch-action: pan-y;
  cursor: grab;
}
.ring-wrap:active { cursor: grabbing; }

.ring {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform: translateZ(calc(var(--radius) * -1px)) rotateY(calc(var(--turn) * 1deg));
}

.ring-card {
  position: absolute;
  top: 50%;
  left: 50%;
  width: var(--card-w);
  height: var(--card-h);
  margin: calc(var(--card-h) / -2) 0 0 calc(var(--card-w) / -2);
  transform: rotateY(calc(var(--i) * var(--step) * 1deg)) translateZ(calc(var(--radius) * 1px));
  border-radius: 6px;
  overflow: hidden;
  background: rgba(0,0,0,.35);
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
  /* the far side of the ring dims instead of competing with the front */
  opacity: var(--o, 1);
  transition: opacity .25s linear;
}
.ring-card img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  -webkit-user-drag: none;
  user-select: none;
}
.ring-card figcaption {
  position: absolute;
  inset: auto 0 0 0;
  padding: 1.6rem .9rem .8rem;
  background: linear-gradient(to top, rgba(8,10,18,.92), transparent);
  color: #E8E1D4;
}
.ring-card .c-title { font-family: var(--font-display, Georgia, serif); font-size: 1.05rem; line-height: 1.2; }
.ring-card .c-where { display: block; margin-top: .2rem; font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; opacity: .75; }

.ring-controls { display: flex; gap: .6rem; justify-content: center; align-items: center; }
.ring-controls button {
  font: inherit;
  font-size: .78rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .55rem 1rem;
  min-height: 44px;
  color: inherit;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 2px;
  cursor: pointer;
  opacity: .75;
}
.ring-controls button:hover, .ring-controls button:focus-visible { opacity: 1; }

/* Nothing spins on its own if the visitor asked for less motion. The card the
   ring is showing still works, it just does not move until they move it. */
@media (prefers-reduced-motion: reduce) {
  .ring { transition: none; }
}
</style>

<main class="wrap inner" style="max-width:none">
  <header class="page-head" style="text-align:center">
    <p class="eyebrow">demo — not linked from the site</p>
    <h1>Drag the ring</h1>
    <p class="lede">Ten real photographs from Sarangada and Kandhamal. Drag, swipe, or use the arrow keys.</p>
  </header>

  <div class="ring-wrap" id="ring-wrap" role="region" aria-roledescription="carousel"
       aria-label="Photographs from Sarangada and Kandhamal" tabindex="0">
    <div class="ring" id="ring"></div>
  </div>

  <div class="ring-controls">
    <button type="button" data-step="-1" aria-label="Previous photograph">&larr; prev</button>
    <button type="button" id="ring-play" aria-pressed="false">auto</button>
    <button type="button" data-step="1" aria-label="Next photograph">next &rarr;</button>
  </div>
</main>

<script>
(function () {
  var PHOTOS = [
    { slug:'terraces',       w:1600, h:900,  title:'Paddy terraced into the hillside', where:'Kandhamal, Oct 2025', alt:'Paddy terraced into a hillside in Kandhamal, banana and palm above the bunds' },
    { slug:'women-earth',    w:1200, h:1600, title:'Sorting the harvest on bare earth', where:'Sarangada, Jan 2025', alt:'Women sorting harvest on bare red earth outside a mud-walled house' },
    { slug:'market-hills',   w:1600, h:739,  title:'Market road, hills behind',        where:'Sarangada, Jan 2025', alt:'The market road with hills rising behind the shopfronts' },
    { slug:'fire-night',     w:1600, h:1600, title:'The fire after dark',              where:'Sarangada, Jan 2025', alt:'People standing around a fire after dark' },
    { slug:'school-marbles', w:640,  h:1280, title:'Marbles, before the bell',         where:'Sarangada',          alt:'Three boys crouched over marbles on packed earth, a girl in a blue uniform watching from concrete steps' },
    { slug:'mist-hills',     w:1600, h:900,  title:'Mist on the Eastern Ghats',        where:'Kandhamal, Sep 2025', alt:'Mist sitting on forested hills of the Eastern Ghats' },
    { slug:'thali',          w:901,  h:1600, title:'Rice, dal and greens',             where:'Sarangada, Jan 2025', alt:'Rice, dal and greens served in steel bowls' },
    { slug:'road-ghats',     w:900,  h:1600, title:'The road climbing west',           where:'Kandhamal, Oct 2025', alt:'The road climbing west into the Eastern Ghats' },
    { slug:'pandal',         w:1600, h:739,  title:'Inside the festival pandal',       where:'Sarangada, Jan 2025', alt:'Crowd seated inside a decorated festival pandal' },
    { slug:'water-tower',    w:1600, h:739,  title:'The water tower at dusk',          where:'Sarangada, May 2024', alt:'The village water tower against an evening sky' }
  ];

  var wrap = document.getElementById('ring-wrap');
  var ring = document.getElementById('ring');
  var step = 360 / PHOTOS.length;
  var turn = 0, cards = [], goal = null;

  // Card size and ring radius both come off the viewport, so this works at 360px
  // as well as on a desktop. The React version hard-coded 300x400 at radius 600,
  // which puts most of the ring off a phone screen.
  function measure() {
    var w = Math.min(300, Math.max(150, wrap.clientWidth * 0.52));
    var h = Math.min(400, wrap.clientHeight * 0.78);
    // radius that keeps neighbouring cards from overlapping at this card width
    var r = Math.round((w / 2) / Math.tan(Math.PI / PHOTOS.length) * 1.08);
    ring.style.setProperty('--card-w', w + 'px');
    ring.style.setProperty('--card-h', h + 'px');
    ring.style.setProperty('--radius', r);
    ring.style.setProperty('--step', step);
  }

  PHOTOS.forEach(function (p, i) {
    var fig = document.createElement('figure');
    fig.className = 'ring-card';
    fig.style.setProperty('--i', i);
    fig.setAttribute('role', 'group');
    fig.setAttribute('aria-label', p.title);
    fig.innerHTML =
      '<img src="assets/photos/' + p.slug + '.jpg" alt="' + p.alt + '"' +
      ' width="' + p.w + '" height="' + p.h + '" loading="lazy" decoding="async">' +
      '<figcaption><span class="c-title">' + p.title + '</span>' +
      '<span class="c-where">' + p.where + '</span></figcaption>';
    ring.appendChild(fig);
    cards.push(fig);
  });

  // One write per frame, and only when the number actually changed.
  var applied = null;
  function render() {
    if (turn === applied) return;
    applied = turn;
    ring.style.setProperty('--turn', turn);
    for (var i = 0; i < cards.length; i++) {
      var a = ((i * step + turn) % 360 + 360) % 360;   // 0 = facing the viewer
      var off = a > 180 ? 360 - a : a;
      cards[i].style.setProperty('--o', Math.max(0.18, 1 - off / 155).toFixed(3));
    }
  }

  // ---- drag / swipe ----------------------------------------------------------
  var down = false, lastX = 0, vel = 0;
  wrap.addEventListener('pointerdown', function (e) {
    down = true; lastX = e.clientX; vel = 0; goal = null; auto = false; sync();
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - lastX; lastX = e.clientX;
    vel = dx * 0.25;
    turn += vel;
  });
  ['pointerup', 'pointercancel'].forEach(function (t) {
    wrap.addEventListener(t, function () { down = false; });
  });

  // ---- keyboard + buttons ----------------------------------------------------
  // One card per press, eased rather than jumped. Pressing twice quickly moves two
  // cards instead of restarting the same move, which is why the goal accumulates.
  function nudge(dir) {
    auto = false; sync();
    vel = 0;
    goal = (goal === null ? Math.round(turn / step) * step : goal) + dir * step;
  }
  wrap.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { nudge(-1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { nudge(1); e.preventDefault(); }
  });
  document.querySelectorAll('[data-step]').forEach(function (b) {
    b.addEventListener('click', function () { nudge(+b.dataset.step); });
  });

  // ---- auto-rotate, off by default when the visitor asked for less motion -----
  var calm = matchMedia('(prefers-reduced-motion: reduce)');
  var auto = !calm.matches;
  var playBtn = document.getElementById('ring-play');
  function sync() {
    playBtn.setAttribute('aria-pressed', String(auto));
    playBtn.textContent = auto ? 'pause' : 'auto';
  }
  playBtn.addEventListener('click', function () { auto = !auto; sync(); });
  calm.addEventListener('change', function (e) { auto = !e.matches; sync(); });
  sync();

  function ease(to) {
    var d = to - turn;
    if (Math.abs(d) > 0.05) { turn += d * 0.14; return false; }
    turn = to;
    return true;
  }

  function frame() {
    if (!down) {
      if (Math.abs(vel) > 0.06) {
        turn += vel;
        vel *= 0.90;              // glide, but land in about half a second
        goal = null;
      } else if (goal !== null) {
        vel = 0;
        if (ease(goal)) goal = null;
      } else if (auto) {
        vel = 0;
        turn += 0.06;
      } else {
        // Settle on the nearest photograph. Without this the ring stopped wherever
        // the glide ran out, which is usually halfway between two of them — two
        // half-turned cards and nothing facing you.
        vel = 0;
        ease(Math.round(turn / step) * step);
      }
    }
    render();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', measure, { passive: true });
  measure();
  render();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
